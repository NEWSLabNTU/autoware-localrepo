# Build, test and (optionally) release autoware-localrepo on the self-hosted
# runners described in ci/runner/README.md:
#   localrepo-amd64          the x86 host
#   localrepo-arm64, -jp62   the arm64 server; it builds the Jetson packages
#                            natively, as there is no Jetson online
#
# SECURITY: these runners hold the host's Docker socket, which is root on the
# host. Never add a pull_request or pull_request_target trigger to this file,
# and never point another workflow at the localrepo-* labels. Both triggers
# below need write access to the repository.
#
# Releases are created as DRAFTS. Publishing one is a deliberate step done by
# a maintainer on GitHub after checking the assets.
name: localrepo

on:
  push:
    # A tag such as 1.9.0-2 builds 1.9.0 for every platform and attaches the
    # result to a draft release of that tag.
    tags: ['[0-9]+.[0-9]+.[0-9]+-[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: Autoware version directory to build
        type: choice
        options: ['1.9.0', '1.7.1', '1.5.0']
        default: '1.9.0'
      platforms:
        description: Comma-separated platforms (amd64, arm64, jp62)
        type: string
        default: 'amd64,arm64,jp62'
      release_tag:
        description: Draft release to attach the debs to (e.g. 1.9.0-2); empty builds and tests only
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # One build per version at a time: the runners keep their build trees
  # between runs, and two runs of one version would share them.
  group: localrepo-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false

env:
  # colcon2deb commit to build with. Bump deliberately; a new colcon2deb can
  # change every package it produces.
  COLCON2DEB_REF: f4a74a5264430270c8b38b1f7da31215dbe02d1d

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creates the draft release
    outputs:
      version: ${{ steps.plan.outputs.version }}
      platforms: ${{ steps.plan.outputs.platforms }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_PLATFORMS: ${{ inputs.platforms }}
          IN_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            version="${REF_NAME%-*}"; tag="$REF_NAME"; platforms="amd64,arm64,jp62"
          else
            version="$IN_VERSION"; tag="$IN_TAG"; platforms="$IN_PLATFORMS"
          fi
          if [ -n "$tag" ] && [ "${tag%-*}" != "$version" ]; then
            echo "::error::release tag $tag does not belong to version $version"; exit 1
          fi
          json=$(python3 -c '
          import json, sys
          allowed = {"amd64", "arm64", "jp62"}
          items = [p.strip() for p in sys.argv[1].split(",") if p.strip()]
          bad = [p for p in items if p not in allowed]
          if bad or not items:
              sys.exit(f"unknown or empty platforms: {bad or items}")
          print(json.dumps(sorted(set(items))))' "$platforms")
          {
            echo "version=$version"
            echo "platforms=$json"
            echo "release_tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, platforms $json, release ${tag:-none}" >> "$GITHUB_STEP_SUMMARY"
      - name: Create the draft release
        if: steps.plan.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.release_tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; assets will be added to it"
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Autoware $TAG" --notes "Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: [self-hosted, autoware-localrepo, 'localrepo-${{ matrix.platform }}']
    # A cold colcon2deb build is many hours; self-hosted jobs may run 5 days.
    timeout-minutes: 4320
    env:
      DIR: ${{ needs.plan.outputs.version }}/${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the gitignored build trees and downloads from earlier runs;
          # colcon2deb rebuilds only what changed.
          clean: false

      - name: Fetch the Autoware source
        run: |
          set -euo pipefail
          test -d "$DIR" || { echo "::error::$DIR does not exist on this ref"; exit 1; }
          git submodule sync -- "$DIR/source"
          git submodule update --init -- "$DIR/source"
          cd "$DIR/source"
          vcs import --recursive src < autoware.repos

      - name: Install colcon2deb
        run: |
          set -euo pipefail
          # Under LOCALREPO_RUNNER_ROOT, which the host's Docker daemon sees
          # at the same path: colcon2deb bind-mounts its helper scripts from
          # its own install directory into the builder container.
          venv="$LOCALREPO_RUNNER_ROOT/venv/colcon2deb-$COLCON2DEB_REF"
          if [ ! -x "$venv/bin/colcon2deb" ]; then
            python3 -m venv "$venv"
            "$venv/bin/pip" install --quiet "colcon2deb @ git+https://github.com/NEWSLabNTU/colcon2deb@$COLCON2DEB_REF"
          fi
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Download models and theme
        working-directory: ${{ env.DIR }}
        run: just download-data download-theme

      - name: Build
        working-directory: ${{ env.DIR }}
        run: just all

      - name: Test
        working-directory: ${{ env.DIR }}
        run: just test

      - name: Stage release files
        working-directory: ${{ env.DIR }}
        run: |
          set -euo pipefail
          just release
          out="$LOCALREPO_RUNNER_ROOT/out/$GITHUB_RUN_ID/${{ matrix.platform }}"
          rm -rf "$out" && mkdir -p "$out"
          cp packages/release/*.deb "$out/"
          du -h "$out"/*.deb | tee -a "$GITHUB_STEP_SUMMARY"

  # A separate job per platform, on the same host, so the upload gets a fresh
  # GITHUB_TOKEN: a job's token expires after 24 hours, and a cold build can
  # take longer than that.
  upload:
    needs: [plan, build]
    if: needs.plan.outputs.release_tag != ''
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: [self-hosted, autoware-localrepo, 'localrepo-${{ matrix.platform }}']
    permissions:
      contents: write
    steps:
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.release_tag }}
        run: |
          set -euo pipefail
          out="$LOCALREPO_RUNNER_ROOT/out/$GITHUB_RUN_ID/${{ matrix.platform }}"
          have=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for f in "$out"/*.deb; do
            name=$(basename "$f")
            case "$name" in
              autoware-localrepo-*)
                gh release upload "$TAG" "$f" --clobber ;;
              *)
                # The autoware-data debs are architecture-independent and
                # built from the same downloads on every platform, so the
                # first platform to get here uploads them.
                if grep -qxF "$name" <<<"$have"; then
                  echo "$name already attached"
                else
                  gh release upload "$TAG" "$f" || gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qxF "$name"
                fi ;;
            esac
          done
          rm -rf "$out"

  checksums:
    needs: [plan, upload]
    if: needs.plan.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write SHA256SUMS.txt from the attached assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.release_tag }}
        run: |
          set -euo pipefail
          # GitHub records a sha256 digest for every release asset, so the
          # checksums come from the API rather than from downloading the debs.
          # releases/tags/<tag> does not return drafts, so search the list.
          gh api --paginate "repos/$GH_REPO/releases" --jq '
            .[] | select(.tag_name == env.TAG) | .assets[] | select(.name | endswith(".deb"))
            | "\(.digest // "" | ltrimstr("sha256:"))  \(.name)"' | sort -k2 > SHA256SUMS.txt
          [ -s SHA256SUMS.txt ] || { echo "::error::no debs attached to $TAG"; exit 1; }
          tee -a "$GITHUB_STEP_SUMMARY" < SHA256SUMS.txt
          if grep -qv '^[0-9a-f]\{64\}  ' SHA256SUMS.txt; then
            echo "::error::an asset has no sha256 digest"; exit 1
          fi
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          echo "Draft release $TAG is ready for review: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
